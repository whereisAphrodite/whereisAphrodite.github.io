# Site details: edit these to rename your blog or change its description.
title: whereisAphrodite
author: whereisaphrodite
description: I love the fuking world!
language: en
timezone: America/Los_Angeles
url: https://whereisaphrodite.com

theme: next
source_dir: source
public_dir: public
new_post_name: :title.md
default_layout: draft
permalink: :year/:month/:day/:title/
updated_option: date
render_drafts: false
future: false
date_format: YYYY-MM-DD
time_format: HH:mm:ss
per_page: 10

# Keep the original tag links, including punctuation in the tag names.
tag_map:
  normal&abnormal: normal-abnormal
  normal and(/or) abnormal: normal-and-or-abnormal

index_generator:
  path: ''
  per_page: 10
  order_by: -date

highlight:
  enable: true
  line_number: false

# Keep CNAME as plain text in the generated site.
skip_render:
  - CNAME
